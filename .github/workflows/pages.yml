name: Deploy to Pages

# The site is plain static files — no build step, no bundler. This workflow only
# exists to publish the repo root, and it is inert until Pages is enabled.
on:
  push:
    branches: [main]
  # A push made by the Actions bot does not trigger other workflows — GitHub
  # blocks that to prevent recursion. Without this the daily snapshot commits
  # fresh data that never reaches the site, and the terminal quietly serves
  # yesterday's numbers.
  workflow_run:
    workflows: ["Chain snapshot", "Volume"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      # Every deploy gets its own asset URLs. Without this a fix is live on the
      # server and absent from the browser for ten minutes, which is
      # indistinguishable from the fix never having happened.
      - run: node tools/stamp.mjs "${{ github.sha }}"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
